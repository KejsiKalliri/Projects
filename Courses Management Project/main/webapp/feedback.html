<html>
    <head>
        <title>Leave feedback</title>
        <meta charset="utf-8">
        <link rel="stylesheet" type="text/css" href="star.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" />
        <script src="rateStars.js"></script>
    </head>
    <body>
    <form action="CommentsServlet" method="post">
        <div id="leaveFeedback">
            <form id="leaveFeedbackForm" onsubmit="validateForm()">
   
          <div class="rate">
    <input type="radio" id="star5" name="rate" value="5" />
    <label for="star5" title="text">5 stars</label>
    <input type="radio" id="star4" name="rate" value="4" />
    <label for="star4" title="text">4 stars</label>
    <input type="radio" id="star3" name="rate" value="3" />
    <label for="star3" title="text">3 stars</label>
    <input type="radio" id="star2" name="rate" value="2" />
    <label for="star2" title="text">2 stars</label>
    <input type="radio" id="star1" name="rate" value="1" />
    <label for="star1" title="text">1 star</label>
  </div>
            
                <textarea type="text" name="comment" id="inputFeedback" placeholder="Leave your feedback (max. 1000 characters)" maxlength="1000" required></textarea>
                <button type="submit">Submit</button>
                <button type="reset" >Reset</button>
            </form>
        </div>
      </form>  
    </body>
</html>
