<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Log In</title>
    <link rel="stylesheet" type="text/css" href="loginStyle.css">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css" />
     <script src="../script.js">
     
     </script>
</head>
<body>
    
    <div class="loginForm">
        <form action="LoginServlet" method="post">
            <div class="input-row email">
                <input type="email" id="logInEmail" required name="email" placeholder="Email: name.surname@fti.edu.al">
            </div>
            <div class="input-row">
                <input type="password" id="logInPassword" required name="Password" placeholder="Password">
                <i class="bi bi-eye-slash" id="togglePassword" onclick="showLogInPassword()"></i>
            </div>
            <a href="#" id="forgotPassword">Forgot password?</a>
            <br>
            <br>
            <button type="submit">Log In</button>
        </form>
        <br>
        
        <h4>Not registered? 
            <a href = "signup.html">Sign up here</a>
        </h4>
    </div>
</body>
<footer>
    <p>&copy; Copyright 2024 - Polytechnic University of Tirana</p>
</footer>
</html>
