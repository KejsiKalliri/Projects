        <script type="text/javascript">
       
        function seeFeedback(){
        	    
        	    var xhr = new XMLHttpRequest();  //XMLHttpRequest (XHR) objects are used to interact with servers
        	    xhr.open("POST","http://localhost:8080/DemoServlet/seefeedbackservlet",false); //url is an address to a file on a server
        	    xhr.setRequestHeader("Content-type","application/x-www-form-url-encoded");  //sets the value of an HTTP request header.
        	    xhr.onreadystatechange = function(){  //This should not be used with synchronous requests
        	        if(xhr.readyState === XMLHttpRequest.DONE && xhr.status === 200){
        	            //Handle the response from the backend
        	            console.log(xhr.responseText);
        	            document.getElementById("seeFeedback").innerHTML = xhr.responseText;
        	        }
        	    };

        	    xhr.send();
        	}
        
        
        window.addEventListener("load",seeFeedback,false)
        
        </script>
